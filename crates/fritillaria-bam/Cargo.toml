[package]
name = "fritillaria-bam"
description = "BAM: reader, writer, index, and device-resident columnar decoding."
# Carries the vendored noodles-bam version; see the root manifest.
version = "0.95.0"
edition.workspace = true
rust-version.workspace = true
# Mixed: `io`/`bai`/`fs`/`record`/`async` are vendored from noodles-bam,
# `columnar` is ours. See VENDORED.md.
license = "Apache-2.0 AND MIT"
repository.workspace = true

[features]
async = [
  "dep:futures",
  "dep:pin-project-lite",
  "dep:tokio",
  "fritillaria-bgzf/async",
  "fritillaria-csi/async",
]

[dependencies]
fritillaria-core.workspace = true

# Vendored path.
bstr.workspace = true
indexmap.workspace = true
memchr.workspace = true
fritillaria-bgzf.workspace = true
fritillaria-csi.workspace = true
fritillaria-sam.workspace = true

futures = { workspace = true, optional = true, features = ["std"] }
pin-project-lite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util"] }

[dev-dependencies]
# Needed to decompress the committed htslib fixtures in tests/htslib.rs.
# `testing` gives HostDeviceCodec, so the device reader's carry logic is driven
# by a real BAM consumer without a GPU.
fritillaria-bgzf = { workspace = true, features = ["testing"] }
# `testing` gives the host-memory stand-in for device allocations, so the
# columnar device types are exercised on a machine with no GPU.
fritillaria-core = { workspace = true, features = ["testing"] }
fritillaria-sam = { workspace = true, features = ["async"] }
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["async"]

[[example]]
name = "bam_count_async"
required-features = ["async"]

[[example]]
name = "bam_idxstats_async"
required-features = ["async"]

[[example]]
name = "bam_query_async"
required-features = ["async"]

[[example]]
name = "bam_read_header_async"
required-features = ["async"]

[[example]]
name = "bam_reheader_async"
required-features = ["async"]

[[example]]
name = "bam_view_async"
required-features = ["async"]

[[example]]
name = "bam_write_async"
required-features = ["async"]
