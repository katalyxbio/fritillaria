[package]
name = "fritillaria-bam"
description = "BAM header parsing, record boundary discovery, and columnar decoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fritillaria-core.workspace = true

[dev-dependencies]
# Needed to decompress the committed htslib fixtures in tests/htslib.rs.
fritillaria-bgzf.workspace = true
# `testing` gives the host-memory stand-in for device allocations, so the
# columnar device types are exercised on a machine with no GPU.
fritillaria-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
