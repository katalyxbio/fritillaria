[package]
name = "fritillaria-csi"
version = "0.61.0"
# Vendored unchanged from `noodles-csi`; the authorship below is upstream's and
# stays. See VENDORED.md.
authors = ["Michael Macias <zaeleus@gmail.com>"]
license = "MIT"
edition.workspace = true
rust-version.workspace = true
description = "Coordinate-sorted index (CSI) format reader and writer"
homepage = "https://github.com/katalyxbio/fritillaria"
repository = "https://github.com/katalyxbio/fritillaria"
documentation = "https://docs.rs/fritillaria-csi"
categories = ["parser-implementations", "science::bioinformatics"]

[features]
async = ["dep:futures", "dep:pin-project-lite", "dep:tokio", "fritillaria-bgzf/async"]

[dependencies]
bit-vec = "0.10.1"
bstr.workspace = true
futures = { workspace = true, optional = true, features = ["std"] }
indexmap.workspace = true
fritillaria-bgzf = { path = "../fritillaria-bgzf", version = "0.51.0" }
fritillaria-core = { path = "../fritillaria-core", version = "0.20.0" }

pin-project-lite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
missing_docs = "warn"

[package.metadata.docs.rs]
features = ["async"]

[[example]]
name = "csi_count_async"
required-features = ["async"]
