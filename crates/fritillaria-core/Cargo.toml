[package]
name = "fritillaria-core"
description = "Shared types and backend traits for fritillaria."
# Carries the vendored noodles-core version: the vendored crates refer to each
# other by `version` as well as by `path`.
version = "0.20.0"
edition.workspace = true
rust-version.workspace = true
# Mixed: the backend seam is ours, `position`/`region` are vendored from
# noodles-core. See VENDORED.md.
license = "Apache-2.0 AND MIT"
repository.workspace = true

[features]
# Host-memory stand-ins for device memory, so the device-resident design is
# testable on a machine with no GPU. Scaffolding: not on by default.
testing = []

[dependencies]
bstr.workspace = true
thiserror.workspace = true

[lints]
workspace = true
